<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a2740">
<meta name="robots" content="noindex">
<title>옆자리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a2740'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f5b04c'/%3E%3C/svg%3E">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px; box-sizing: border-box; background: #1a2740; color: #c9d2e0; text-align: center;
    font: 17px/1.75 "Apple SD Gothic Neo", "Noto Serif KR", serif; word-break: keep-all;
  }
  .lamp { width: 10px; height: 10px; border-radius: 50%; background: #f5b04c; box-shadow: 0 0 26px 10px rgba(245, 176, 76, .4); }
  button { min-height: 46px; padding: 8px 26px; font: inherit; border: 0; border-radius: 4px; background: #f5b04c; color: #33240d; cursor: pointer; }
  button:focus-visible { outline: 2px solid #f5b04c; outline-offset: 3px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<div class="lamp" aria-hidden="true"></div>
<p id="msg" role="status">정류장으로 가는 중이에요.</p>
<button id="again" hidden>다시 가기</button>
<script>
const msg = document.getElementById("msg");
const again = document.getElementById("again");

async function go() {
  again.hidden = true;
  msg.textContent = "정류장으로 가는 중이에요.";
  try {
    const r = await fetch(`tunnel.json?t=${Date.now()}`, { cache: "no-store" });
    const { url } = await r.json();
    await fetch(`${url}api/sea`, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(8000) });
    location.replace(url);
  } catch {
    msg.textContent = "지금은 정류장에 갈 수 없어요. 잠시 뒤에 다시 눌러 주세요.";
    again.hidden = false;
  }
}

again.onclick = go;
go();
</script>
</body>
</html>
